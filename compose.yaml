services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mewhelp}
      MYSQL_USER: ${MYSQL_USER:-mewhelp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mewhelp}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mewhelp-root}
    ports:
      # 本机装有原生 MySQL94 服务占用 3306，容器发布到 13306；应用经 .env MYSQL_PORT 连接
      - "127.0.0.1:13306:3306"
    volumes:
      - mewhelp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---- ch03 · Milvus standalone 三件套（etcd 元数据 + MinIO 对象存储 + Milvus）----
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - mewhelp_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

  minio:
    # minio/minio 旧版 RELEASE 标签已于 2025 年被 MinIO 从 Docker Hub 清库，
    # 新标签在本机网络下返回 pull access denied；bitnami/minio 也已下架，
    # 改用 Broadcom 保留的 bitnamilegacy/minio（S3 API 兼容，Milvus 可正常对接）。
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - mewhelp_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9000'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

  milvus:
    # ch04 · 升级到 2.5.x：BM25 全文检索 + RRF 混合检索需要 2.5+（数据卷保留）
    image: milvusdb/milvus:v2.5.6
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - mewhelp_milvus_data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  mewhelp_mysql_data:
  mewhelp_etcd_data:
  mewhelp_minio_data:
  mewhelp_milvus_data:
